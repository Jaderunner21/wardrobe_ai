project_id = "wardrobe-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Resend SMTP. Supabase's built-in sender is capped at 2 emails/hour project-wide,
# and every sign-in here is an email because there are no passwords (module 03 §1).
#
# This block configures the LOCAL CLI stack only. The hosted project is configured in
# the dashboard under Project Settings > Authentication > SMTP Settings, and the API
# key lives there — never in this repo. See docs/email-smtp.md.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(SMTP_SENDER_EMAIL)"
sender_name = "Wardrobe AI"

# Google OAuth — module 03 §1. Secrets come from the environment, never this file.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
