project_id = "wardrobe-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true

# TEST PHASE: off, so sign-up sends no email and completes immediately.
#
# Supabase's built-in sender is capped at 2 emails per hour PROJECT-WIDE. With
# confirmations on, the third tester to sign up in any hour gets
# `over_email_send_rate_limit` and simply cannot get in — which is what happened. The
# limit is on email, not on sign-ins, so the fix is to send none: the login screen is a
# password form (app/(auth)/login/page.tsx) and any address works because nothing is
# delivered to it.
#
# Turn this back on when custom SMTP is configured (docs/email-smtp.md) and before real
# users exist — an unconfirmed address means someone can sign up as an address they do
# not own, which is acceptable for fifteen known testers and not beyond that.
#
# NOTE: this file configures the LOCAL CLI stack. The HOSTED project has its own copy of
# this setting and `supabase config push` is NOT the way to sync it — pushing this file
# would also set the hosted site_url to localhost:3000, disable Google, and point SMTP at
# an unset key. Change it in the dashboard: Authentication > Providers > Email.
enable_confirmations = false

# Resend SMTP — parked. Configured for the LOCAL stack only; the hosted project's SMTP
# lives in the dashboard under Project Settings > Authentication, and the API key lives
# there rather than in this repo. See docs/email-smtp.md.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(SMTP_SENDER_EMAIL)"
sender_name = "Wardrobe AI"

# Google OAuth — module 03 §1. Secrets come from the environment, never this file.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
